name: Preparar configuracion privada PHP sin publicar sitio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactor-hosting-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Crear entorno nuevo y diagnostico solo en cuenta privada
        env:
          FTP_SERVER: ${{ secrets.REFACTOR_FTPS_SERVER }}
          FTP_PORT: ${{ secrets.REFACTOR_FTPS_PORT }}
          PRIVATE_USER: ${{ secrets.REFACTOR_FTPS_PRIVATE_USERNAME }}
          PRIVATE_PASSWORD: ${{ secrets.REFACTOR_FTPS_PRIVATE_PASSWORD }}
        run: python3 tools/refactor/hosting/private-setup.py
      - name: Conservar solo recibo sin claves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-private-setup-${{ github.run_id }}
          path: private-setup-result.json
          retention-days: 7
          if-no-files-found: error
