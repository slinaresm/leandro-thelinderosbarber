name: Subir API privada sin publicar React

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Escribe PREPARAR_API_PRIVADA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: refactor-hosting-production
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.confirmation == 'PREPARAR_API_PRIVADA'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, gd, fileinfo, curl, openssl
          tools: composer:v2
          coverage: none
      - name: Instalar dependencias de produccion sin scripts
        working-directory: api
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts --classmap-authoritative
      - name: Construir paquete privado sin entorno ni datos
        run: node tools/refactor/hosting/private-api-package.mjs .refactor-data/private-api-release
      - name: Subir solo a la cuenta privada conservando entorno y almacenamiento
        env:
          FTP_SERVER: ${{ secrets.REFACTOR_FTPS_SERVER }}
          FTP_PORT: ${{ secrets.REFACTOR_FTPS_PORT }}
          PRIVATE_USER: ${{ secrets.REFACTOR_FTPS_PRIVATE_USERNAME }}
          PRIVATE_PASSWORD: ${{ secrets.REFACTOR_FTPS_PRIVATE_PASSWORD }}
        run: python3 tools/refactor/hosting/private-api-upload.py
      - name: Conservar solo recibo del paquete sin claves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-private-api-${{ github.run_id }}
          path: private-api-upload-result.json
          retention-days: 7
          if-no-files-found: error
