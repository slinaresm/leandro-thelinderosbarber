<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi cuenta — Barber Linderos</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--border); }
  .topbar .logo { font-family: var(--font-display); font-weight: 700; }
  .topbar .logo span { color: var(--gold-bright); }
  .topbar .logo img { height: 36px; width: auto; display: block; border-radius: 6px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 24px 100px; }

  .loyalty-card { display: flex; align-items: center; justify-content: space-between; padding: 32px; margin-bottom: 40px; }
  .loyalty-level { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; color: var(--gold-bright); }
  .loyalty-points { color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; }

  .resv-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0; border-bottom: 1px solid var(--border);
  }
  .resv-item:last-child { border-bottom: none; }
  .resv-item h4 { font-size: 1rem; margin-bottom: 4px; }
  .resv-item .meta { color: var(--text-muted); font-size: 0.85rem; }
  .resv-actions { display: flex; gap: 8px; }
  h2.section-title { font-size: 1.3rem; margin-bottom: 20px; }

  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .photo-card { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-elevated); }
  .photo-card img { width: 100%; height: 140px; object-fit: cover; display: block; }
  .photo-card .tag { padding: 8px 10px; font-size: 0.72rem; color: var(--text-muted); display: flex; justify-content: space-between; }

  @media (max-width: 600px) {
    .topbar { padding: 14px 20px; gap: 10px; flex-wrap: wrap; }
    .topbar .logo { font-size: 0.95rem; }
    .wrap { padding: 32px 16px 80px; }
    .loyalty-card { flex-wrap: wrap; gap: 12px; padding: 24px; }
    .resv-item { flex-direction: column; align-items: flex-start; gap: 10px; }
    .resv-actions { width: 100%; }
    .resv-actions .btn { width: 100%; }
  }
</style>
<link rel="stylesheet" href="/assets/css/brand.css">
<link rel="icon" type="image/png" href="/assets/img/linderos-logo-v2.png">
</head>
<body>
<div class="topbar">
  <a href="/" class="logo"><img src="/assets/img/linderos-logo-v2.png" alt="Barber Linderos"></a>
  <div style="display:flex; gap:12px;">
    <a href="/reservar" class="btn btn-primary btn-sm">Nueva reserva</a>
    <button id="logout-btn" class="btn btn-outline btn-sm">Salir</button>
  </div>
</div>

<div class="wrap">
  <div class="card loyalty-card">
    <div>
      <div class="text-muted" style="font-size:0.85rem;">Tu nivel de fidelización</div>
      <div class="loyalty-level" id="loyalty-level">—</div>
    </div>
    <div style="text-align:right;">
      <div class="loyalty-points" id="loyalty-points">0 puntos</div>
    </div>
  </div>

  <h2 class="section-title">Mis próximas citas</h2>
  <div class="card" id="upcoming-list" style="margin-bottom:40px;">Cargando...</div>

  <h2 class="section-title">Historial de cortes</h2>
  <div class="card" id="history-list" style="margin-bottom:40px;">Cargando...</div>

  <h2 class="section-title">Mis pedidos (tienda)</h2>
  <div class="card" id="orders-list" style="margin-bottom:40px;">Cargando...</div>

  <h2 class="section-title">Mis fotos (antes / después)</h2>
  <div class="card">
    <div class="photo-grid" id="photo-gallery">Cargando...</div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script>
(async () => {
  const user = Auth.requireRole('cliente', '/ingresar');
  if (!user) return;

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await Auth.clearSession();
    window.location.href = '/ingresar';
  });

  document.getElementById('loyalty-level').textContent = user.loyaltyLevel || 'Bronce';
  document.getElementById('loyalty-points').textContent = `${user.loyaltyPoints || 0} puntos`;

  try {
    const { reservations } = await apiRequest('/reservations');

    const upcoming = reservations.filter(r => r.status === 'confirmed');
    const past = reservations.filter(r => r.status !== 'confirmed');

    const upcomingEl = document.getElementById('upcoming-list');
    upcomingEl.innerHTML = upcoming.length ? upcoming.map(r => `
      <div class="resv-item">
        <div>
          <h4>${r.service_name} con ${r.barber_name}</h4>
          <div class="meta">${r.date} · ${r.start_time} — <span class="badge badge-success">Confirmada</span></div>
        </div>
        <div class="resv-actions">
          <button class="btn btn-danger btn-sm" data-cancel="${r.id}">Cancelar</button>
        </div>
      </div>
    `).join('') : '<p class="text-muted">No tienes citas próximas.</p>';

    document.getElementById('history-list').innerHTML = past.length ? past.map(r => `
      <div class="resv-item">
        <div>
          <h4>${r.service_name} con ${r.barber_name}</h4>
          <div class="meta">${r.date} · ${r.start_time}</div>
        </div>
        <span class="badge ${r.status === 'completed' ? 'badge-success' : 'badge-muted'}">${r.status}</span>
      </div>
    `).join('') : '<p class="text-muted">Aún no tienes historial de cortes.</p>';

    document.querySelectorAll('[data-cancel]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('¿Cancelar esta cita?')) return;
        try {
          await apiRequest(`/reservations/${btn.dataset.cancel}/cancel`, { method: 'PATCH' });
          showToast('Cita cancelada. El horario ya está disponible de nuevo.', 'success');
          setTimeout(() => location.reload(), 800);
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    });
  } catch (e) {
    showToast('No se pudo cargar tu historial.', 'error');
  }

  try {
    const { orders } = await apiRequest('/orders');
    const ordersEl = document.getElementById('orders-list');
    const statusLabel = { pending: 'Pendiente', paid: 'Pagado', failed: 'Fallido' };
    const statusBadge = { pending: 'badge-muted', paid: 'badge-success', failed: 'badge-danger' };
    ordersEl.innerHTML = orders.length ? orders.map(o => `
      <div class="resv-item">
        <div>
          <h4>Pedido #${o.buy_order}</h4>
          <div class="meta">${o.items.map(i => `${i.quantity}× ${i.name}`).join(', ')}</div>
          <div class="meta">${new Date(o.created_at).toLocaleDateString('es-CL')} · $${o.total.toLocaleString('es-CL')}</div>
        </div>
        <span class="badge ${statusBadge[o.status] || 'badge-muted'}">${statusLabel[o.status] || o.status}</span>
      </div>
    `).join('') : '<p class="text-muted">Aún no tienes pedidos en la tienda.</p>';
  } catch (e) {
    document.getElementById('orders-list').innerHTML = '<p class="text-muted">No se pudieron cargar tus pedidos.</p>';
  }

  try {
    const { photos } = await apiRequest('/photos');
    const gallery = document.getElementById('photo-gallery');
    gallery.innerHTML = photos.length ? photos.map(p => `
      <div class="photo-card">
        <img src="${API_BASE_URL.replace('/api', '')}${p.photo_url}" alt="${p.type}">
        <div class="tag"><span>${p.type === 'antes' ? 'Antes' : 'Después'}</span><span>${p.barber_name}</span></div>
      </div>
    `).join('') : '<p class="text-muted">Aún no tienes fotos de tus cortes.</p>';
  } catch (e) {
    document.getElementById('photo-gallery').innerHTML = '<p class="text-muted">No se pudieron cargar tus fotos.</p>';
  }
})();
</script>
</body>
</html>
