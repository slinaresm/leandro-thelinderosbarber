<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — Barber Linderos</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(circle at 50% 0%, rgba(200, 32, 46,0.12), transparent 60%);
  }
  .auth-card { width: 100%; max-width: 420px; }
  .auth-logo { text-align: center; margin-bottom: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
  .auth-logo span { color: var(--gold-bright); }
  .auth-logo img { height: 64px; width: auto; border-radius: 8px; }
  .auth-card h1 { font-size: 1.6rem; text-align: center; margin: 20px 0 8px; }
  .auth-card p.sub { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; }
  .auth-foot { text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-muted); }
</style>
<link rel="stylesheet" href="/assets/css/brand.css">
<link rel="icon" type="image/png" href="/assets/img/linderos-logo-v2.png">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><img src="/assets/img/linderos-logo-v2.png" alt="Barber Linderos"></div>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Reserva tu próximo corte en menos de 60 segundos</p>

    <div class="card">
      <form id="register-form">
        <div class="field">
          <label>Nombre completo</label>
          <input type="text" name="name" required placeholder="Tu nombre">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required placeholder="tu@email.com">
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input type="tel" name="phone" placeholder="+56 9 1234 5678">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" name="password" required minlength="12" placeholder="Mínimo 12 caracteres">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Crear cuenta</button>
      </form>
    </div>

    <p class="auth-foot">¿Ya tienes cuenta? <a href="/ingresar" class="text-gold">Inicia sesión</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/assistant.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const form = new FormData(e.target);
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      const data = await apiRequest('/auth/register', {
        method: 'POST',
        auth: false,
        body: {
          name: form.get('name'),
          email: form.get('email'),
          phone: form.get('phone'),
          password: form.get('password'),
        },
      });
      Auth.setSession(data.token, data.user);
      showToast(`¡Cuenta creada, ${data.user.name}!`, 'success');
      setTimeout(() => Auth.redirectForRole(data.user), 600);
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Crear cuenta';
    }
  });
</script>
</body>
</html>
